name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check homepage for an A/B experiment section (sectionExperiment) and its variant weight
        run: |
          curl -sS "https://sundayred.vercel.app/" -o home.html
          echo "=== bytes ==="; wc -c home.html
          echo "=== data-ab-key occurrences (one per experiment section on the page) ==="
          grep -oE 'data-ab-key="[^"]*"' home.html | sort | uniq -c
          echo "=== data-ab-variant occurrences (one per variant markup, ALL ship regardless of pick) ==="
          grep -oE 'data-ab-variant="[^"]*"' home.html | sort | uniq -c
          echo "=== does the experiment shell appear at all? ==="
          grep -c 'data-ab-key' home.html || true
          echo
          echo "=== rough per-variant size: split home.html on data-ab-variant markers and show byte length of each chunk up to the next sibling/close ==="
          awk 'BEGIN{RS="data-ab-variant=\""} NR>1{print length($0)" bytes starting: " substr($0,1,40)}' home.html
          echo
          echo "=== count of <script and <img tags inside the whole document (rough JS/media weight) ==="
          grep -o '<script' home.html | wc -l
          grep -o '<img' home.html | wc -l
          echo
          echo "=== section markers in document order (data-mode wrappers = section boundaries) to see where in the page any experiment sits ==="
          grep -oE '<(section|div)[^>]*data-mode="[^"]*"[^>]*>' home.html | head -20
      - name: Commit (no-op, log-only probe)
        run: echo "probe is log-only, nothing to commit"

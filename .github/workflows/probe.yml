name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage payload anatomy (TBT regression hunt)
        run: |
          curl -sSL "https://sundayred.vercel.app/" -o home.html
          echo "--- total HTML bytes:"
          wc -c < home.html
          echo "--- inline script bytes (all <script> without src):"
          python3 - <<'EOF'
          import re
          html = open("home.html", encoding="utf-8", errors="replace").read()
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S)
          total = sum(len(s) for s in scripts)
          print(f"{len(scripts)} inline scripts, {total} bytes total")
          for s in sorted(scripts, key=len, reverse=True)[:5]:
              print(f"  {len(s):>8} bytes :: {s[:120].replace(chr(10),' ')}")
          ext = re.findall(r'<script[^>]*\bsrc="([^"]+)"', html)
          print(f"{len(ext)} external scripts:")
          for u in ext: print("  ", u)
          imgs = re.findall(r'<img[^>]*\bsrc="([^"]+)"', html)
          print(f"{len(imgs)} <img> tags; first 5:")
          for u in imgs[:5]: print("  ", u[:140])
          links = re.findall(r'<link[^>]*rel="preload"[^>]*>', html)
          print(f"{len(links)} preloads:")
          for l in links[:8]: print("  ", l[:160])
          EOF
          echo "--- announcement bar present?"
          grep -c "announcement-bar" home.html || true
          echo "--- number of section wrappers (data-mode):"
          grep -o 'data-mode="[a-z-]*"' home.html | sort | uniq -c || true
      - name: Lighthouse benchmarkIndex + bootup attribution (runner-speed check)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx -y lighthouse@12 "https://sundayred.vercel.app/" \
            --only-categories=performance --output=json --output-path=lh.json \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" --quiet
          node -e "
            const r = require('./lh.json');
            console.log('benchmarkIndex', Math.round(r.environment.benchmarkIndex));
            console.log('perf', Math.round(r.categories.performance.score*100),
              'tbt', Math.round(r.audits['total-blocking-time'].numericValue));
            const items = r.audits['bootup-time'].details?.items ?? [];
            for (const it of items.slice(0,6))
              console.log('  bootup', Math.round(it.total), 'ms ::', (it.url||'').slice(0,90));
            const mt = r.audits['mainthread-work-breakdown'].details?.items ?? [];
            for (const it of mt.slice(0,6))
              console.log('  mainthread', Math.round(it.duration), 'ms ::', it.groupLabel);
          "
      - name: Preview A/B — Lighthouse the known-good commit with real CMS data
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          for host in \
            "sundayred-git-claude-website-design-framework-h7b1kw.vercel.app" \
            "sundayred-git-claude-website-design-framework-h7b1kw-btravis08.vercel.app" \
            "sundayred-git-claude-website-design-framework-h7b1kw-btravis08s-projects.vercel.app"; do
            code=$(curl -s -o preview.html -w "%{http_code}" --max-time 30 "https://$host/") || code=000
            echo "$host → $code ($(wc -c < preview.html) bytes)"
            if [ "$code" = "200" ] && ! grep -qi "Authentication Required\|vercel.com/sso" preview.html; then
              echo "== measuring https://$host/ =="
              npx -y lighthouse@12 "https://$host/" \
                --only-categories=performance --output=json --output-path=lh-preview.json \
                --chrome-flags="--headless=new --no-sandbox --disable-gpu" --quiet
              node -e "
                const r = require('./lh-preview.json');
                console.log('PREVIEW(good commit) perf', Math.round(r.categories.performance.score*100),
                  'tbt', Math.round(r.audits['total-blocking-time'].numericValue),
                  'lcp', Math.round(r.audits['largest-contentful-paint'].numericValue));
                const items = r.audits['bootup-time'].details?.items ?? [];
                for (const it of items.slice(0,4))
                  console.log('  bootup', Math.round(it.total), 'ms ::', (it.url||'').slice(0,90));
              "
              python3 - <<'EOF'
          import re
          html = open("preview.html", encoding="utf-8", errors="replace").read()
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S)
          print(f"preview inline: {len(scripts)} scripts, {sum(len(s) for s in scripts)} bytes; html {len(html)} bytes")
          EOF
              break
            fi
          done

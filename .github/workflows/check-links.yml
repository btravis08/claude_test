name: check-links

# Nightly sweep of production: every sitemap URL must respond 2xx/3xx,
# and every internal href found on the homepage + shop-all must
# resolve. Fails red when anything is broken.
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl sitemap + key pages
        run: |
          set -uo pipefail
          BASE="https://sundayred.vercel.app"
          fails=0

          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$1")
            if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
              echo "::error::$code $1"
              fails=$((fails+1))
            fi
          }

          echo "--- sitemap URLs"
          urls=$(curl -fsSL "$BASE/sitemap.xml" | grep -oE "<loc>[^<]+" | sed 's/<loc>//')
          count=$(echo "$urls" | wc -l)
          echo "checking $count sitemap URLs"
          for u in $urls; do check "$u"; done

          echo "--- internal hrefs on / and /collections/shop-all"
          for page in "/" "/collections/shop-all"; do
            hrefs=$(curl -fsSL "$BASE$page" \
              | grep -oE 'href="/[^"#?]*' | sed 's/href="//' | sort -u | head -80)
            for h in $hrefs; do check "$BASE$h"; done
          done

          echo "broken links: $fails"
          [ "$fails" -eq 0 ]

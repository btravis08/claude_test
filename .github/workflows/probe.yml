name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which article layout does prod serve (SSR HTML)?
        run: |
          html=$(curl -sSL "https://sundayred.vercel.app/journal/sunday-at-augusta")
          echo "data-field-hero (unified fullscreen layout): $(echo "$html" | grep -c 'data-field-hero' || true)"
          echo "old breadcrumb header pt-[10rem]: $(echo "$html" | grep -c 'pt-\[10rem\]' || true)"
          echo "old 16/9 hero: $(echo "$html" | grep -c 'sm:aspect-\[16/9\]' || true)"
          echo "--- response headers ---"
          curl -sSI "https://sundayred.vercel.app/journal/sunday-at-augusta" | grep -iE 'x-vercel|^age|cache-control|etag' || true
      - name: Landing serves minimized nav?
        run: |
          echo "minimized chip on /journal: $(curl -sSL 'https://sundayred.vercel.app/journal' | grep -c 'Open menu' || true)"

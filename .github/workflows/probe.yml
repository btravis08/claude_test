name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect presidio PDP hero image (preload + LCP img + CDN asset)
        run: |
          echo "=== fetching production HTML ==="
          curl -sS "https://sundayred.vercel.app/products/presidio" -o page.html
          wc -c page.html
          echo
          echo "=== preload link(s) for image ==="
          grep -oE '<link rel="preload"[^>]*as="image"[^>]*>' page.html || echo "NO IMAGE PRELOAD FOUND"
          echo
          echo "=== first no-scrollbar hero img tag ==="
          grep -oE '<img[^>]*class="absolute left-0 top-1/2[^>]*>' page.html | head -3
          echo
          echo "=== extracting first hero img src ==="
          SRC=$(grep -oE '<img[^>]*class="absolute left-0 top-1/2[^>]*src="[^"]*"' page.html | head -1 | grep -oE 'src="[^"]*"' | sed 's/src="//;s/"$//')
          echo "SRC=$SRC"
          if [ -n "$SRC" ]; then
            echo "=== HEAD request timing for that asset ==="
            curl -sS -o /dev/null -w "http_code=%{http_code} size=%{size_download} total_time=%{time_total} ttfb=%{time_starttransfer}\n" "$SRC"
          fi
      - name: Commit (no-op, log-only probe)
        run: echo "probe is log-only, nothing to commit"

name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Does the deployed field bundle contain the clamp fix?
        run: |
          html=$(curl -sSL "https://sundayred.vercel.app/journal/alt")
          chunks=$(echo "$html" | grep -oE '/_next/static/chunks/[^"]+\.js' | sort -u)
          echo "chunks referenced: $(echo "$chunks" | wc -l)"
          found=0
          for c in $chunks; do
            if curl -sSL "https://sundayred.vercel.app$c" | grep -q "max-height:none"; then
              echo "clamp fix FOUND in $c"
              found=1
            fi
          done
          echo "clamp-fix-present: $found"

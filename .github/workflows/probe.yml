name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Aigency dashboard — is the 1Password ORBR project live?
        run: |
          echo "=== /framework headers ==="
          curl -sSIL "https://aigency-red.vercel.app/framework" | sed -n '1,20p'
          echo "=== /framework body checks ==="
          curl -sSL "https://aigency-red.vercel.app/framework" -o fw.html
          wc -c < fw.html
          echo "--- 1Password mentions:"
          grep -c "1Password" fw.html || echo "NOT FOUND"
          echo "--- Oracle Red Bull mentions:"
          grep -c "Oracle Red Bull" fw.html || echo "NOT FOUND"
          echo "--- known projects (sanity check the files backend is serving):"
          grep -c "Method Homes" fw.html || echo "Method Homes NOT FOUND"
          grep -c "Atelier North" fw.html || echo "Atelier North NOT FOUND"
          echo "--- project links present:"
          grep -o 'href="/framework/[a-z0-9-]*"' fw.html | sort | uniq -c || true
      - name: Project overview page
        run: |
          echo "=== /framework/1password-orbr ==="
          curl -sS -o proj.html -w "HTTP %{http_code}\n" "https://aigency-red.vercel.app/framework/1password-orbr"
          grep -c "they run on it" proj.html || echo "USP NOT FOUND"
          head -c 400 proj.html; echo

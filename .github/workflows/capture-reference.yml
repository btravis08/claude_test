name: capture-reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright-core
        run: npm init -y >/dev/null 2>&1 && npm i playwright-core --no-save
      - name: Grab the site bundle (shader source lives in it)
        run: |
          mkdir -p design/reference/photoyoshi
          curl -sSL "https://photoyoshi.com/assets/js/script.js" -o design/reference/photoyoshi/script.js
          wc -c design/reference/photoyoshi/script.js
      - name: Record intro + interactions on video
        run: |
          mkdir -p /tmp/vid design/reference/photoyoshi/frames
          node <<'EOF'
          const { chromium } = require("playwright-core");
          (async () => {
            const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome" });
            const ctx = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              recordVideo: { dir: "/tmp/vid", size: { width: 1440, height: 900 } },
            });
            const page = await ctx.newPage();
            await page.goto("https://photoyoshi.com", { waitUntil: "commit", timeout: 45000 }).catch(() => {});
            // intro plays untouched
            await page.waitForTimeout(9000);
            // slow horizontal hover sweep (column reveal behavior)
            for (let x = 100; x <= 1340; x += 20) {
              await page.mouse.move(x, 460);
              await page.waitForTimeout(40);
            }
            // scroll bursts (bend behavior)
            for (let i = 0; i < 5; i++) { await page.mouse.wheel(0, 600); await page.waitForTimeout(120); }
            await page.waitForTimeout(1400);
            for (let i = 0; i < 5; i++) { await page.mouse.wheel(0, -600); await page.waitForTimeout(120); }
            await page.waitForTimeout(1600);
            await ctx.close();
            await browser.close();
          })();
          EOF
          f=$(ls /tmp/vid/*.webm | head -1)
          ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=8,scale=720:-1" -q:v 6 design/reference/photoyoshi/frames/v%03d.jpg
          ls design/reference/photoyoshi/frames | wc -l
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/reference/photoyoshi
          git checkout -- package.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Reference capture: photoyoshi bundle JS + video frames of intro/hover/scroll"
          git push

name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pre-overwrite singletons from Sanity history API
        run: |
          mkdir -p design/restore
          # page-home / navigation / siteSettings as they were before the
          # 2026-08-04T22:43Z sample-pack overwrite (public dataset read)
          code=$(curl -sS -o design/restore/singletons-pre-pack.json -w "%{http_code}" \
            "https://alsdve2t.api.sanity.io/v2026-07-01/data/history/production/documents/page-home,navigation,siteSettings?time=2026-08-04T20:00:00Z")
          echo "HTTP $code"
          wc -c design/restore/singletons-pre-pack.json
          head -c 600 design/restore/singletons-pre-pack.json; echo
          test "$code" = "200"
          echo "=== BASE64 START ==="
          base64 -w0 design/restore/singletons-pre-pack.json
          echo
          echo "=== BASE64 END ==="
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/restore
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Restore capture: pre-sample-pack singletons from Sanity history"
          git push

name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Is the live homepage hero the reverted V1 at 100svh?
        run: |
          html=$(curl -sSL "https://sundayred.vercel.app/")
          echo "--- h-svh present in hero markup:"
          echo "$html" | grep -c "h-svh" || true
          echo "--- V1 overlay signature (big display headline class):"
          echo "$html" | grep -o 'sdr-text-reveal[^"]*text-headline-lg' | head -2 || true
          echo "--- V2 signature (should be ABSENT — title-lg centered row):"
          echo "$html" | grep -o 'flex-1 text-center font-display text-title-lg' | head -2 || true
          echo "--- hero media src:"
          echo "$html" | grep -oE '(hero-media|campaign|cdn\.sanity)[^"]*' | head -4 || true

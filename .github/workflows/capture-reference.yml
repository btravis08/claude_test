name: capture-reference

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright-core
        run: npm init -y >/dev/null 2>&1 && npm i playwright-core --no-save
      - name: Grab the site bundle (shader source lives in it)
        run: |
          mkdir -p design/reference/photoyoshi
          curl -sSL "https://photoyoshi.com/assets/js/script.js" -o design/reference/photoyoshi/script.js
          wc -c design/reference/photoyoshi/script.js
      - name: Record intro + interactions via CDP screencast
        run: |
          mkdir -p design/reference/photoyoshi/frames
          node <<'EOF'
          const { chromium } = require("playwright-core");
          const fs = require("fs");
          (async () => {
            const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome" });
            const ctx = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await ctx.newPage();
            const cdp = await ctx.newCDPSession(page);
            let n = 0;
            let last = 0;
            cdp.on("Page.screencastFrame", ({ data, sessionId, metadata }) => {
              /* throttle to ~8fps so the frame set stays reviewable */
              const t = metadata.timestamp || 0;
              if (t - last >= 0.12) {
                last = t;
                fs.writeFileSync(
                  `design/reference/photoyoshi/frames/s${String(n++).padStart(3, "0")}.jpg`,
                  Buffer.from(data, "base64"),
                );
              }
              cdp.send("Page.screencastFrameAck", { sessionId }).catch(() => {});
            });
            await cdp.send("Page.startScreencast", { format: "jpeg", quality: 62, maxWidth: 720, maxHeight: 450, everyNthFrame: 1 });
            await page.goto("https://photoyoshi.com", { waitUntil: "commit", timeout: 45000 }).catch(() => {});
            // intro plays untouched
            await page.waitForTimeout(9000);
            // slow horizontal hover sweep (column reveal behavior)
            for (let x = 100; x <= 1340; x += 20) {
              await page.mouse.move(x, 460);
              await page.waitForTimeout(40);
            }
            // scroll bursts (bend behavior)
            for (let i = 0; i < 5; i++) { await page.mouse.wheel(0, 600); await page.waitForTimeout(120); }
            await page.waitForTimeout(1400);
            for (let i = 0; i < 5; i++) { await page.mouse.wheel(0, -600); await page.waitForTimeout(120); }
            await page.waitForTimeout(1600);
            await cdp.send("Page.stopScreencast").catch(() => {});
            await browser.close();
            console.log("frames:", n);
          })();
          EOF
          ls design/reference/photoyoshi/frames | wc -l
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/reference/photoyoshi
          git checkout -- package.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Reference capture: photoyoshi bundle JS + video frames of intro/hover/scroll"
          git push

name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage payload anatomy (TBT regression hunt)
        run: |
          curl -sSL "https://sundayred.vercel.app/" -o home.html
          echo "--- total HTML bytes:"
          wc -c < home.html
          echo "--- inline script bytes (all <script> without src):"
          python3 - <<'EOF'
          import re
          html = open("home.html", encoding="utf-8", errors="replace").read()
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S)
          total = sum(len(s) for s in scripts)
          print(f"{len(scripts)} inline scripts, {total} bytes total")
          for s in sorted(scripts, key=len, reverse=True)[:5]:
              print(f"  {len(s):>8} bytes :: {s[:120].replace(chr(10),' ')}")
          ext = re.findall(r'<script[^>]*\bsrc="([^"]+)"', html)
          print(f"{len(ext)} external scripts:")
          for u in ext: print("  ", u)
          imgs = re.findall(r'<img[^>]*\bsrc="([^"]+)"', html)
          print(f"{len(imgs)} <img> tags; first 5:")
          for u in imgs[:5]: print("  ", u[:140])
          links = re.findall(r'<link[^>]*rel="preload"[^>]*>', html)
          print(f"{len(links)} preloads:")
          for l in links[:8]: print("  ", l[:160])
          EOF
          echo "--- announcement bar present?"
          grep -c "announcement-bar" home.html || true
          echo "--- number of section wrappers (data-mode):"
          grep -o 'data-mode="[a-z-]*"' home.html | sort | uniq -c || true
      - name: PSI (Google-hosted Lighthouse) — independent of runner noise
        run: |
          for path in "/" "/products/presidio"; do
            url="https://sundayred.vercel.app${path}"
            curl -s --max-time 120 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$url")&strategy=mobile&category=performance" -o psi.json
            python3 - "$path" <<'EOF'
          import json, sys
          d = json.load(open("psi.json"))
          lr = d.get("lighthouseResult")
          if not lr:
              print(sys.argv[1], "PSI error:", json.dumps(d)[:300]); raise SystemExit
          print(sys.argv[1], "PSI mobile perf:", round(lr["categories"]["performance"]["score"] * 100))
          for k in ("largest-contentful-paint", "total-blocking-time", "cumulative-layout-shift", "speed-index"):
              print("   ", k, lr["audits"][k]["displayValue"])
          EOF
          done
